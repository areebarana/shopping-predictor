<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Prediction System</title>

    <link rel="stylesheet" href="./model.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🛒 Shopping Prediction</h1>

        <p class="subtitle">
            Predict customer purchasing behavior using Machine Learning
        </p>

        <form action="/predict" method="POST">

            <div class="input-box">
                <label>Age</label>
                <input type="number"
                       name="age"
                       placeholder="Enter age"
                       required>
            </div>

            <div class="input-box">
                <label>Income</label>
                <input type="number"
                       name="income"
                       placeholder="Enter income"
                       required>
            </div>

            <div class="input-box">
                <label>Pages Visited</label>
                <input type="number"
                       name="pages"
                       placeholder="Pages visited"
                       required>
            </div>

            <div class="input-box">
                <label>Time Spent</label>
                <input type="number"
                       name="time_spent"
                       placeholder="Minutes"
                       required>
            </div>

            <button type="submit">
                Predict
            </button>

        </form>

        {% if prediction %}

        <div class="result {{status}}">
            {{ prediction }}
        </div>

        {% endif %}

    </div>

</div>

</body>
<script src="./model.py"></script>
</html>
